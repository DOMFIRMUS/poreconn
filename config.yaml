# poreconn configuration
# Paths are relative to this file unless absolute.
# The raw reconstructions are only needed by the `extract` stage. Everything after it reads the
# grey-level volumes of interest (VOIs) in `paths.voi_dir`, which are the files deposited on Zenodo.

paths:
  raw_root: "D:/02_Projetos_e_Eventos/Tomografia"      # override with env PORECONN_RAW
  voi_dir: "data/voi"
  lab_csv: "data/lab_porosity.csv"
  legacy_csv: "data/legacy_dissertation.csv"
  outputs: "outputs"

voi:
  edge: 300                 # VOI edge length in (output) voxels
  max_per_sample: 3         # replicate VOIs stacked along z, non-overlapping
  z_margin_frac: 0.10       # keep VOIs away from the first/last 10 % of the stack
  gap: 20                   # slices between replicate VOIs

segmentation:
  median_size: 3            # 3-D median filter (as in the dissertation)
  iso_fraction: 0.5         # threshold = air + f * (solid - air); 0.5 = ISO-50 partial-volume rule
                            # references fixed per sample; see poreconn/segment.py
  sensitivity: [0.4, 0.6]   # alternative fractions reported as bounds
  connectivity: 6           # pore-phase connectivity (6 = face neighbours)

# Air references carried through the sub-volume, coarsening and transport analyses: T50 uses the air
# outside the plug, T50int the air inside the large pores of the rocks (the bead packs have a single
# reference, the pore air, so they are analysed once).
air_variants: [T50, T50int]

coarsening:
  factors: [1, 2, 3, 4]     # block-averaging of the filtered grey VOI before re-thresholding
  all_replicates: true      # every VOI, not only the main one

rev:
  edges: [50, 75, 100, 150, 200, 300]

transport:
  fd_tol: 1.0e-6            # relative residual of the conjugate-gradient diffusion solve
  fd_maxiter: 20000
  lbm_edge: 150             # lbm stage domain: the whole VOI if its mirrored spanning pore space has
                            # <= 3e6 nodes, else the central lbm_edge^3 cube (then also the whole VOI
                            # binned by 2, as a domain-size check)
  lbm_tau: 1.0               # tau+ for the bead packs (wide pores); Lambda = 3/16 fixes tau-
  lbm_tau_rock: 0.55         # tau+ for the rocks: faster pressure equilibration, same steady state
  lbm_maxiter: 100000
  lbm_tol: 1.0e-6
  lbm_max_nodes: 3.0e6       # mirrored spanning nodes above which the central lbm_edge^3 cube is used
  threshold_variants: [T40, T50, T60, T50int]   # rocks, whole main VOI: F, k_PNM, k_KC at each threshold
  pnm: true

# group: granular (glass-bead packs), limestone (reef limestone, Tambaba Fm.), coquina (Tambaba Fm.),
#        trachyte (Pernambuco Basin)
# bin: in-plane and axial binning applied when the VOI is read (2 = 2x2x2 block mean)
